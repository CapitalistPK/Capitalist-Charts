<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capitalist Charts analytics end-to-end</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: Inter, system-ui, sans-serif; margin: 0; padding: 24px 16px; background: #faf9fa; color: #1b1c1d; }
    body.dark { background: #0b0b0c; color: #ececee; }
    main { max-width: 1120px; margin: 0 auto; display: grid; gap: 22px; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: #737784; margin: 8px 0 -10px; }
    .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .controls button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #ccc; background: transparent; color: inherit; cursor: pointer; }
    p.prose { max-width: 720px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Host site (another origin)</h1>
    <p>Reads the compatible local data service used by the browser test harness.</p>
    <div class="controls">
      <button data-theme="light">Light</button><button data-theme="dark">Dark</button><button data-theme="transparent">Transparent</button>
      <button data-locale="en">English</button><button data-locale="ur">اردو</button>
    </div>

    <h2>Market</h2>
    <div class="row">
      <cap-sector-performance></cap-sector-performance>
      <cap-index-contributors index="PSX:KSE100"></cap-index-contributors>
      <cap-sector-money-map></cap-sector-money-map>
    </div>
    <cap-watchlist symbols="PSX:KSE100,PSX:OGDC,PSX:HBL,PSX:LUCK,PSX:ENGROH,PSX:SYS"></cap-watchlist>
    <h2>Company</h2>
    <div class="row">
      <cap-company-profile symbol="PSX:LUCK"></cap-company-profile>
      <cap-valuation symbol="PSX:LUCK"></cap-valuation>
      <cap-financials symbol="PSX:LUCK"></cap-financials>
      <cap-dividends symbol="PSX:LUCK"></cap-dividends>
      <cap-insider-trades symbol="PSX:LUCK"></cap-insider-trades>
      <cap-radar symbol="PSX:LUCK"></cap-radar>
      <cap-shariah symbol="PSX:MEBL"></cap-shariah>
      <cap-seasonality symbol="PSX:LUCK"></cap-seasonality>
    </div>
    <p class="prose">Meezan Bank <cap-shariah symbol="PSX:MEBL" shape="inline"></cap-shariah> is one of the listed Islamic banks.</p>
    <h2>Funds and news</h2>
    <div class="row">
      <cap-fund-performance fund="meezan-islamic-fund"></cap-fund-performance>
      <cap-fund-leaderboard category="equity"></cap-fund-leaderboard>
      <cap-news></cap-news>
    </div>
    <h2>Economy and tools</h2>
    <div class="row">
      <cap-futures-board rows="8"></cap-futures-board>
      <cap-economic-calendar></cap-economic-calendar>
      <cap-macro code="PAK.FUEL.MS.RETAIL"></cap-macro>
      <cap-fx-heatmap></cap-fx-heatmap>
      <cap-commodities></cap-commodities>
    </div>
    <cap-screener preset="relative_strength"></cap-screener>
    <cap-tax-calculator salary="250000"></cap-tax-calculator>
  </main>
  <script type="module">
    import { mockAdapter } from '../../packages/core/dist/index.js';
    window.CapitalistCharts = { adapter: mockAdapter() };
    await import('../../packages/elements/cdn/loader.js');
    const all = () => document.querySelectorAll('main *');
    document.querySelectorAll('[data-theme]').forEach((b) => b.addEventListener('click', () => {
      document.body.classList.toggle('dark', b.dataset.theme === 'dark');
      all().forEach((el) => el.localName.startsWith('cap-') && el.setAttribute('theme', b.dataset.theme));
    }));
    document.querySelectorAll('[data-locale]').forEach((b) => b.addEventListener('click', () => {
      all().forEach((el) => el.localName.startsWith('cap-') && el.setAttribute('locale', b.dataset.locale));
    }));
  </script>
</body>
</html>
