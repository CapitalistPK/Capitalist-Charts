name: Release
# Publishes every package to npm when a version tag (v1.2.3) is pushed.
# npm trusted publishing (OIDC): no npm token is stored anywhere. Each package must name this
# repository and workflow as a trusted publisher on npmjs.com once. Provenance is attached.
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/*/package.json; do
            v=$(node -p "require('./$p').version")
            [ "$v" = "$tag" ] || { echo "$p is $v, tag is $tag"; exit 1; }
          done
      - run: pnpm --recursive --filter "./packages/*" publish --access public --no-git-checks
