name: Uptime monitor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      # A fixed commit keeps the status monitor reproducible after the template is copied.
      - uses: upptime/uptime-monitor@2e53e7570ad597ccf3f251d43502846a042165d2 # v1.44.0
